apiVersion: apps/v1
kind: Deployment
metadata:
  name: quelpoke
  namespace: deodat
  labels:
    app.kubernetes.io/name: quelpoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quelpoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quelpoke
    spec:
      containers:
        - name: quelpoke
          image: europe-west9-docker.pkg.dev/cs-poc-hpzdycpiqjyvinhrczvlwcn/student-deodat/quelpoke-go:1.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "52Mi"
              cpu: "50m"
            limits:
              memory: "52Mi"
              cpu: "50m"