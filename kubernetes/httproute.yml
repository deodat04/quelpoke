apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: quelpoke
  namespace: deodat
  labels:
    app.kubernetes.io/name: quelpoke
spec:
  parentRefs:
    - kind : Gateway
      name: external-http-gateway
      namespace: infra
  hostnames:
    - quelpoke.copy-paste.pro
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /deodat
      backendRefs:
        - name: quelpoke
          port: 8080